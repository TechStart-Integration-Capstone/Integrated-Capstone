server:
  port: 8083

spring:
  application:
    name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:PayPink2.0_StrongPass!}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      pool-name: TransactionHikariPool
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms
      connect-timeout: 3000ms

app:
  interest:
    enabled: ${INTEREST_EOD_ENABLED:false}
    start-date: ${INTEREST_START_DATE:}
    zone: ${INTEREST_ZONE:Asia/Manila}
    cron: ${INTEREST_EOD_CRON:59 59 23 * * *}
    recovery-cron: ${INTEREST_RECOVERY_CRON:0 15 * * * *}
    postgres:
      url: ${INTEREST_POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      username: ${INTEREST_POSTGRES_USERNAME:}
      password: ${INTEREST_POSTGRES_PASSWORD:}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
