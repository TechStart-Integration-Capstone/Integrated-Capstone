server:
  port: 8083
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 500
    max-connections: 10000

spring:
  application:
    name: transaction-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=false}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:PayPink2.0_StrongPass!}
    hikari:
      maximum-pool-size: 100
      minimum-idle: 30
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1200000
      pool-name: TransactionHikariPool
      data-source-properties:
        sendStringParametersAsUnicode: false
        statementPoolingCacheSize: 25
        disableStatementPooling: false
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 5000ms
      connect-timeout: 3000ms

app:
  t24-adapter:
    base-url: ${T24_ADAPTER_BASE_URL:http://t24-adapter:8090/api/v1/t24}
    url: ${T24_ADAPTER_URL:http://t24-adapter:8090/api/v1/t24/transfer}
  interest:
    enabled: ${INTEREST_EOD_ENABLED:false}
    start-date: ${INTEREST_START_DATE:}
    auto-backfill-enabled: ${INTEREST_AUTO_BACKFILL_ENABLED:false}
    zone: ${INTEREST_ZONE:Asia/Manila}
    cron: ${INTEREST_EOD_CRON:59 59 23 * * *}
    recovery-cron: ${INTEREST_RECOVERY_CRON:0 15 * * * *}
    postgres:
      url: ${INTEREST_POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      username: ${INTEREST_POSTGRES_USERNAME:}
      password: ${INTEREST_POSTGRES_PASSWORD:}
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      retries: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
