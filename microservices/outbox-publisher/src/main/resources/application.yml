server:
  port: 8087

spring:
  application:
    name: outbox-publisher
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:PayPink2.0_StrongPass!}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      pool-name: OutboxPublisherHikariPool
  jpa:
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: none
    show-sql: false
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all               # wait for leader + all ISR replicas to ack
      retries: 3
      properties:
        enable.idempotence: true   # exactly-once producer semantics per partition

# ── Outbox Publisher tuning ────────────────────────────────────────────────
app:
  outbox:
    poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:5000}   # primary PENDING poll
    retry-interval-ms: ${OUTBOX_RETRY_INTERVAL_MS:30000} # FAILED retry sweep
    batch-size: ${OUTBOX_BATCH_SIZE:50}                  # rows per poll cycle
    max-retries: ${OUTBOX_MAX_RETRIES:5}                 # before DEAD_LETTER

# ── Actuator ──────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
