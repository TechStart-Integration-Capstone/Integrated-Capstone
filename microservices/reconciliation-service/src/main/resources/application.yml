server:
  port: 8086

spring:
  application:
    name: reconciliation-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  datasource:
    oracle:
      jdbc-url: ${ORACLE_DATASOURCE_URL:jdbc:oracle:thin:@localhost:1521/XE}
      driver-class-name: oracle.jdbc.OracleDriver
      username: ${ORACLE_DATASOURCE_USERNAME:ledger_master}
      password: ${ORACLE_DATASOURCE_PASSWORD:MasterSecretPassword123}
      hikari:
        maximum-pool-size: 10
        pool-name: ReconOraclePool
    postgres:
      jdbc-url: ${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      driver-class-name: org.postgresql.Driver
      username: ${POSTGRES_DATASOURCE_USERNAME:audit_user}
      password: ${POSTGRES_DATASOURCE_PASSWORD:AuditSecretPassword123}
      hikari:
        maximum-pool-size: 10
        pool-name: ReconPostgresPool
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  reconciliation:
    cron: "0 */15 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
