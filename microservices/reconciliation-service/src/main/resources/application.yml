server:
  port: 8086

spring:
  application:
    name: reconciliation-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  datasource:
    azure-sql:
      jdbc-url: ${AZURE_SQL_JDBC_URL}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      hikari:
        maximum-pool-size: 10
        pool-name: ReconAzureSqlPool
    postgres:
      jdbc-url: ${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      driver-class-name: org.postgresql.Driver
      username: ${POSTGRES_DATASOURCE_USERNAME:audit_user}
      password: ${POSTGRES_DATASOURCE_PASSWORD:AuditSecretPassword123}
      hikari:
        maximum-pool-size: 10
        pool-name: ReconPostgresPool
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  cloud:
    azure:
      credential:
        managed-identity-enabled: true
        client-id: ${AZURE_MANAGED_IDENTITY_CLIENT_ID:}

app:
  reconciliation:
    cron: "0 */15 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
