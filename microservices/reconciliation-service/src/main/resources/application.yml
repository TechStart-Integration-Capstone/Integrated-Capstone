server:
  port: 8086

spring:
  application:
    name: reconciliation-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
  datasource:
    # Primary OLTP — Azure SQL (SQL Server 2022)
    # Key was previously named "oracle" — renamed in post-Phase-1 cleanup.
    # docker-compose passes ORACLE_DATASOURCE_* env vars which map to this prefix via
    # the environment overrides in AzureSqlDataSourceConfig (@ConfigurationProperties).
    azure-sql:
      jdbc-url: ${SPRING_DATASOURCE_AZURE_SQL_JDBC_URL:${SPRING_DATASOURCE_URL:${ORACLE_DATASOURCE_URL:${AZURE_SQL_JDBC_URL:jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true}}}}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      username: ${SPRING_DATASOURCE_AZURE_SQL_USERNAME:${SPRING_DATASOURCE_USERNAME:${ORACLE_DATASOURCE_USERNAME:${AZURE_SQL_USERNAME:sa}}}}
      password: ${SPRING_DATASOURCE_AZURE_SQL_PASSWORD:${SPRING_DATASOURCE_PASSWORD:${ORACLE_DATASOURCE_PASSWORD:${AZURE_SQL_PASSWORD:PayPink2.0_StrongPass!}}}}
      hikari:
        maximum-pool-size: 10
        pool-name: ReconAzureSqlPool
    # Immutable audit store — PostgreSQL 15
    postgres:
      jdbc-url: ${POSTGRES_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      driver-class-name: org.postgresql.Driver
      username: ${POSTGRES_DATASOURCE_USERNAME:audit_user}
      password: ${POSTGRES_DATASOURCE_PASSWORD:AuditSecretPassword123}
      hikari:
        maximum-pool-size: 10
        pool-name: ReconPostgresPool

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

app:
  reconciliation:
    cron: "0 */15 * * * *"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
