server:
  port: 8080

spring:
  application:
    name: api-gateway

  # ── Redis — backing store for the token-bucket rate limiter ───────────────
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:redis}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 3000ms
      connect-timeout: 2000ms

  cloud:
    gateway:
      # ── Global HTTP client timeouts ──────────────────────────────────────
      httpclient:
        response-timeout: 30s
        connect-timeout: 5000

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: ["GET","POST","PUT","DELETE","OPTIONS","PATCH"]
            allowedHeaders: "*"
            allowCredentials: true
            exposedHeaders: ["Authorization","Idempotency-Key","X-Correlation-ID"]

      # ── Default filters applied to every route ───────────────────────────
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        # Auth Service — public, no rate limiting
        - id: auth-service
          uri: http://${AUTH_SERVICE_HOST:auth-service}:8081
          predicates:
            - Path=/api/v1/auth/**

        # Account Service — read-only, no rate limiting
        - id: account-service
          uri: http://${ACCOUNT_SERVICE_HOST:account-service}:8082
          predicates:
            - Path=/api/v1/accounts/**

        # Transaction Service — RATE LIMITED (write path)
        # Token bucket: 100 req/s steady-state, burst up to 200, keyed per user.
        - id: transaction-service
          uri: http://${TRANSACTION_SERVICE_HOST:transaction-service}:8083
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false
            # Circuit breaker — open after repeated mutation failures
            - name: CircuitBreaker
              args:
                name: transactionCb
                fallbackUri: forward:/fallback/transaction

        # Stress Test — RATE LIMITED
        - id: stress-test
          uri: http://${TRANSACTION_SERVICE_HOST:transaction-service}:8083
          predicates:
            - Path=/api/v1/stress/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false

        # Reconciliation Service
        - id: reconciliation-service
          uri: http://${RECONCILIATION_SERVICE_HOST:reconciliation-service}:8086
          predicates:
            - Path=/api/v1/reconciliation/**

        # Telemetry
        - id: telemetry
          uri: http://${TRANSACTION_SERVICE_HOST:transaction-service}:8083
          predicates:
            - Path=/api/v1/telemetry/**

        # Analytics Service
        - id: analytics-service
          uri: http://${ANALYTICS_SERVICE_HOST:analytics-service}:8088
          predicates:
            - Path=/api/v1/analytics/**

        # Risk Engine (Phase 3) — internal scoring, also exposed for testing
        - id: risk-engine
          uri: http://${RISK_ENGINE_HOST:risk-engine}:8000
          predicates:
            - Path=/api/v1/risk/**
          filters:
            - StripPrefix=3

        # T24 Core Adapter (Phase 4) — internal payment rail, exposed for testing
        - id: t24-adapter
          uri: http://${T24_ADAPTER_HOST:t24-adapter}:8090
          predicates:
            - Path=/api/v1/t24/**

        # Remittance Orchestrator (Phase 5) — 4-step saga engine
        - id: remittance-orchestrator
          uri: http://${TRANSACTION_SERVICE_HOST:transaction-service}:8083
          predicates:
            - Path=/api/v1/remittance/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false

        # Loan Service (Phase 6) — /api/v1/loans/** → loan-service:8091/loans/**
        # /api/v1/loans/eod/** is admin-only (ROLE_ADMIN checked in JwtAuthFilter).
        # transaction-service's /internal/** transfer endpoint is deliberately NOT routed.
        - id: loan-service
          uri: http://${LOAN_SERVICE_HOST:loan-service}:8091
          predicates:
            - Path=/api/v1/loans/**
          filters:
            - StripPrefix=2
            - name: RequestRateLimiter
              args:
                redis-rate-limiter: "#{@redisRateLimiter}"
                key-resolver: "#{@userKeyResolver}"
                deny-empty-key: false

        # Audit Service (Phase 6) — /api/v1/audit/** → audit-service:8085/**
        # Exposes risk-decisions log: GET /api/v1/audit/risk-decisions
        # Requires valid JWT (no public paths).
        - id: audit-service
          uri: http://${AUDIT_SERVICE_HOST:audit-service}:8085
          predicates:
            - Path=/api/v1/audit/**
          filters:
            - StripPrefix=3

# ── JWT secret shared with auth-service ─────────────────────────────────────
app:
  security:
    jwt-secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# ── Resilience4j — circuit breaker for transaction-service mutations ─────────
resilience4j:
  circuitbreaker:
    instances:
      transactionCb:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        failure-rate-threshold: 50
        minimum-number-of-calls: 5
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
  timelimiter:
    instances:
      transactionCb:
        timeout-duration: 28s

# ── Actuator ──────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
