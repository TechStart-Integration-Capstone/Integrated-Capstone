services:
  # ==========================================
  # Layer 4: Datastores & In-Memory Matrix
  # ==========================================
  # ── Azure SQL (SQL Server 2022 local — replaces Oracle XE in Capstone 2) ──
  azure-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: azure-sql-master
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PayPink2.0_StrongPass!
      - MSSQL_PID=Developer
    # No host port — internal only, connect via docker exec or azure-data-studio through docker network
    volumes:
      - azuresql_data:/var/opt/mssql
      # Setup scripts run ONLY when the data volume is empty (first start). Existing volumes skip them;
      # loan-service applies 02_loans.sql itself at startup, so loans work either way.
      - ./../microservices/transaction-service/src/main/resources/schema-azuresql.sql:/mssql-server-setup-scripts.d/01_schema.sql:ro
      - ./../microservices/loan-service/src/main/resources/db/phase6_loans.sql:/mssql-server-setup-scripts.d/02_loans.sql:ro
      - ./../scripts/seed_demo_azure_sql.sql:/mssql-server-setup-scripts.d/03_seed.sql:ro
      - ./../scripts/migrate_phase1_schema_split.sql:/mssql-server-setup-scripts.d/04_schema_split.sql:ro
      - ./../scripts/migrate_interest_azuresql.sql:/mssql-server-setup-scripts.d/05_interest.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'PayPink2.0_StrongPass!' -C -Q 'SELECT 1 FROM dbo.ACCOUNT' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - ledger-net

  postgresql:
    image: postgres:15-alpine
    container_name: postgres-immutable-audit
    environment:
      - POSTGRES_DB=ledger_audit_db
      - POSTGRES_USER=audit_user
      - POSTGRES_PASSWORD=AuditSecretPassword123
    # No host port — internal only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./../microservices/audit-service/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./../microservices/notification-service/src/main/resources/schema-postgres.sql:/docker-entrypoint-initdb.d/02_notification.sql
      - ./../scripts/migrate_interest_postgres.sql:/docker-entrypoint-initdb.d/03_interest.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d ledger_audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ledger-net

  redis:
    image: redis:7-alpine
    container_name: redis-idempotency-matrix
    command: redis-server --save "" --appendonly no --maxmemory 512mb --maxmemory-policy allkeys-lru
    # No host port — internal only
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ledger-net

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - ledger-net

  # ==========================================
  # Layer 5: Event Streaming (Apache Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - ledger-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-event-bus
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ledger-net

  # ==========================================
  # Layer 1: Edge — API Gateway
  # ==========================================
  api-gateway:
    build:
      context: ../microservices/api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      account-service:
        condition: service_started
      transaction-service:
        condition: service_started
      reconciliation-service:
        condition: service_started
      loan-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AUTH_SERVICE_HOST=auth-service
      - ACCOUNT_SERVICE_HOST=account-service
      - TRANSACTION_SERVICE_HOST=transaction-service
      - RECONCILIATION_SERVICE_HOST=reconciliation-service
      - ANALYTICS_SERVICE_HOST=analytics-service
      - RISK_ENGINE_HOST=risk-engine
      - T24_ADAPTER_HOST=t24-adapter
      - LOAN_SERVICE_HOST=loan-service
      - AUDIT_SERVICE_HOST=audit-service
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - ./../microservices/api-gateway/target/api-gateway.jar:/app/app.jar
    networks:
      - ledger-net

  # ==========================================
  # Layer 2 & 3: Microservices
  # ==========================================
  auth-service:
    build:
      context: ../microservices/auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      azure-sql:
        condition: service_healthy
    # No host port — internal only, accessed via api-gateway:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - JWT_SECRET=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    volumes:
      - ./../microservices/auth-service/target/auth-service.jar:/app/app.jar
    networks:
      - ledger-net

  account-service:
    build:
      context: ../microservices/account-service
      dockerfile: Dockerfile
    container_name: account-service
    restart: unless-stopped
    depends_on:
      azure-sql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # No host port — internal only, accessed via api-gateway:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    volumes:
      - ./../microservices/account-service/target/account-service.jar:/app/app.jar
    networks:
      - ledger-net

  transaction-service:
    build:
      context: ../microservices/transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    restart: unless-stopped
    depends_on:
      azure-sql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # No host port — internal only, accessed via api-gateway:8080
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - IDEMPOTENCY_TTL_HOURS=24
      - INTEREST_EOD_ENABLED=${INTEREST_EOD_ENABLED:-false}
      - INTEREST_START_DATE=${INTEREST_START_DATE:-}
      - INTEREST_ZONE=${INTEREST_ZONE:-Asia/Manila}
      - INTEREST_EOD_CRON=${INTEREST_EOD_CRON:-59 59 23 * * *}
      - INTEREST_RECOVERY_CRON=${INTEREST_RECOVERY_CRON:-0 15 * * * *}
      - INTEREST_POSTGRES_URL=${INTEREST_POSTGRES_URL:-jdbc:postgresql://postgresql:5432/ledger_audit_db}
      - INTEREST_POSTGRES_USERNAME=${INTEREST_POSTGRES_USERNAME:-}
      - INTEREST_POSTGRES_PASSWORD=${INTEREST_POSTGRES_PASSWORD:-}
    volumes:
      - ./../microservices/transaction-service/target/transaction-service.jar:/app/app.jar
    networks:
      - ledger-net

  notification-service:
    build:
      context: ../microservices/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # No host port — internal only
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/ledger_audit_db
      - SPRING_DATASOURCE_USERNAME=audit_user
      - SPRING_DATASOURCE_PASSWORD=AuditSecretPassword123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SEMAPHORE_API_KEY=${SEMAPHORE_API_KEY:-}
      - SEMAPHORE_SENDER_NAME=${SEMAPHORE_SENDER_NAME:-PayPink}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST:-smtp.gmail.com}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT:-587}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME:-notifications@paypink.ph}
      - SPRING_MAIL_PASSWORD=${PAYPINK_GMAIL_APP_PASSWORD}
    extra_hosts:
      - "smtp.gmail.com:74.125.203.109"
      - "host.docker.internal:host-gateway"
    volumes:
      - ./../microservices/notification-service/target/notification-service.jar:/app/app.jar
    networks:
      - ledger-net

  audit-service:
    build:
      context: ../microservices/audit-service
      dockerfile: Dockerfile
    container_name: audit-service
    depends_on:
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # No host port — internal only
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/ledger_audit_db
      - SPRING_DATASOURCE_USERNAME=audit_user
      - SPRING_DATASOURCE_PASSWORD=AuditSecretPassword123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./../microservices/audit-service/target/audit-service.jar:/app/app.jar
    networks:
      - ledger-net

  reconciliation-service:
    build:
      context: ../microservices/reconciliation-service
      dockerfile: Dockerfile
    container_name: reconciliation-service
    depends_on:
      azure-sql:
        condition: service_healthy
      postgresql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8086:8086"
    environment:
      - ORACLE_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - ORACLE_DATASOURCE_USERNAME=sa
      - ORACLE_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - POSTGRES_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/ledger_audit_db
      - POSTGRES_DATASOURCE_USERNAME=audit_user
      - POSTGRES_DATASOURCE_PASSWORD=AuditSecretPassword123
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    volumes:
      - ./../microservices/reconciliation-service/target/reconciliation-service.jar:/app/app.jar
    networks:
      - ledger-net

  outbox-publisher:
    build:
      context: ../microservices/outbox-publisher
      dockerfile: Dockerfile
    container_name: outbox-publisher
    depends_on:
      azure-sql:
        condition: service_healthy
      kafka:
        condition: service_healthy
    # No host port — internal only
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - OUTBOX_POLL_INTERVAL_MS=5000
      - OUTBOX_RETRY_INTERVAL_MS=30000
      - OUTBOX_BATCH_SIZE=50
      - OUTBOX_MAX_RETRIES=5
    volumes:
      - ./../microservices/outbox-publisher/target/outbox-publisher.jar:/app/app.jar
    networks:
      - ledger-net

  analytics-service:
    build:
      context: ../microservices/analytics-service
      dockerfile: Dockerfile
    container_name: analytics-service
    depends_on:
      kafka:
        condition: service_healthy
    # No host port — internal only
    environment:
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - ANALYTICS_SERVICE_HOST=analytics-service
    volumes:
      - ./../microservices/analytics-service/target/analytics-service.jar:/app/app.jar
    networks:
      - ledger-net

  # ==========================================
  # Risk Engine (Python FastAPI — Phase 3)
  # ==========================================
  risk-engine:
    build:
      context: ../microservices/risk-engine
      dockerfile: Dockerfile
    container_name: risk-engine
    # No host port — internal only, called by Remittance Orchestrator via http://risk-engine:8000
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=risk-engine
    depends_on:
      - otel-collector
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ledger-net

  # ==========================================
  # T24 Core Adapter + OFS Simulator (Phase 4)
  # ==========================================
  t24-adapter:
    build:
      context: ../microservices/t24-adapter
      dockerfile: Dockerfile
    container_name: t24-adapter
    depends_on:
      azure-sql:
        condition: service_healthy
    environment:
      - T24_SIMULATOR_URL=http://localhost:8090/ofs/process
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - OTEL_SERVICE_NAME=t24-adapter
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    volumes:
      - ./../microservices/t24-adapter/target/t24-adapter.jar:/app/app.jar
    networks:
      - ledger-net

  # ==========================================
  # Loan Service (Phase 6) — apply / accept / repay / EOD
  # ==========================================
  loan-service:
    build:
      context: ../microservices/loan-service
      dockerfile: Dockerfile
    container_name: loan-service
    depends_on:
      azure-sql:
        condition: service_healthy
      transaction-service:
        condition: service_started
    # No host port — internal only, accessed via api-gateway:8080 (/api/v1/loans/**)
    # Money moves only through transaction-service's /internal/remittance/transfer (not routed by the gateway).
    environment:
      - SPRING_DATASOURCE_URL=jdbc:sqlserver://azure-sql:1433;databaseName=master;encrypt=true;trustServerCertificate=true
      - SPRING_DATASOURCE_USERNAME=sa
      - SPRING_DATASOURCE_PASSWORD=PayPink2.0_StrongPass!
      - ORCHESTRATOR_URL=http://transaction-service:8083
      - LOAN_SCHEMA_MIGRATION_ENABLED=false
    volumes:
      - ./../microservices/loan-service/target/loan-service.jar:/app/app.jar
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health | grep -q UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - ledger-net

  # ==========================================
  # Legacy monolith (kept for reference — disabled)
  # ==========================================
  # core-retail-ledger-engine:
  #   build:
  #     context: ../backend
  #     dockerfile: Dockerfile
  #   container_name: core-retail-ledger-app
  #   ports:
  #     - "8099:8080"
  #   networks:
  #     - ledger-net

  # ==========================================
  # Layer 1: Frontend SPA (Nginx)
  # ==========================================
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: frontend-spa
    depends_on:
      - api-gateway
    ports:
      - "80:80"
      - "3001:80"
    networks:
      - ledger-net

  # ==========================================
  # Layer 1: Mobile App (Flutter Web on Nginx)
  # ==========================================
  mobile-app:
    build:
      context: ../mobile
      dockerfile: Dockerfile
    container_name: mobile-app
    depends_on:
      - api-gateway
    ports:
      - "3002:80"
    networks:
      - ledger-net

  # ==========================================
  # Layer 6: Observability & Telemetry
  # ==========================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.87.0
    container_name: otel-collector
    command: ["--config=/etc/otel/otel-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otel/otel-config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"   # Prometheus metrics exporter (OTEL -> Prometheus scrape)
    depends_on:
      - loki
      - tempo
    networks:
      - ledger-net

  loki:
    image: grafana/loki:2.9.0
    container_name: loki-logs
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - ledger-net

  tempo:
    image: grafana/tempo:2.2.0
    container_name: tempo-traces
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"
      - "4317"        # Internal OTLP gRPC from otel-collector (not exposed to host)
    networks:
      - ledger-net

  jaeger:
    image: jaegertracing/all-in-one:1.50
    container_name: jaeger-tracing
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "14268:14268"
    networks:
      - ledger-net

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: prometheus-telemetry
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - ledger-net

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana-dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
      - jaeger
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - ledger-net

  # ==========================================
  # Layer 1: JMeter Load Generator
  # ==========================================
  jmeter:
    build:
      context: ./jmeter
      dockerfile: Dockerfile
    container_name: jmeter-runner
    profiles: ["loadtest"]
    volumes:
      - ./jmeter:/jmeter
    networks:
      - ledger-net

networks:
  ledger-net:
    driver: bridge

volumes:
  azuresql_data:
  postgres_data:
  kafka_data:
  zookeeper_data:
  zookeeper_log:
  loki_data:
  tempo_data:
