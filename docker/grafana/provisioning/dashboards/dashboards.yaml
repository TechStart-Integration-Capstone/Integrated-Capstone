apiVersion: 1

providers:
  - name: 'PayPink Microservices Dashboards'
    orgId: 1
    folder: 'PayPink Observability'
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    overwrite: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
