spring:
  config:
    activate:
      on-profile: docker

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
        jdbc:
          batch_size: 50

  data:
    redis:
      host: redis
      port: 6379

  kafka:
    bootstrap-servers: kafka:29092

app:
  datasource:
    azure-sql:
      url: ${AZURE_SQL_JDBC_URL}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
