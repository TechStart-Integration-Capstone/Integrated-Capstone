server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        # Route 1: Auth Services (Login / Logout / Validate)
        - id: auth-route
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**

        # Route 2: Ledger Balance Mutations & Transactions
        - id: ledger-mutate-route
          uri: ${LEDGER_CORE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/ledger/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1000
                redis-rate-limiter.burstCapacity: 2000
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        # Route 3: Accounts & Profiles
        - id: accounts-route
          uri: ${ACCOUNT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/accounts/**

        # Route 4: Reconciliation Dashboard & Manual Sweeps (ADMIN only - enforced in JwtAuthGlobalFilter)
        #   Must stay ABOVE the catch-all route: routes are matched in list order.
        - id: reconcile-route
          uri: ${EVENT_CONSUMERS_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/reconciliation/**

        # Route 5: Catch-all Fallback to Ledger Core
        - id: default-core-route
          uri: ${LEDGER_CORE_URI:http://localhost:8083}
          predicates:
            - Path=/api/v1/**
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6380}
      timeout: 2000ms

app:
  security:
    jwt-secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
