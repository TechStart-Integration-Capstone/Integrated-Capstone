server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: account-service
  cloud:
    azure:
      credential:
        managed-identity-enabled: true
        client-id: ${AZURE_MANAGED_IDENTITY_CLIENT_ID:}
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false

app:
  datasource:
    azure-sql:
      url: ${AZURE_SQL_JDBC_URL}
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
      hikari:
        pool-name: AccountAzureSqlPool
        maximum-pool-size: 15
        minimum-idle: 5
        connection-timeout: 10000
        idle-timeout: 300000
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
