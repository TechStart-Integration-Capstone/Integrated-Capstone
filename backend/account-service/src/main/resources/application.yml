server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: account-service
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

app:
  datasource:
    oracle:
      url: ${SPRING_DATASOURCE_ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
      username: ${SPRING_DATASOURCE_ORACLE_USERNAME:ledger_master}
      password: ${SPRING_DATASOURCE_ORACLE_PASSWORD:MasterSecretPassword123}
      driver-class-name: oracle.jdbc.OracleDriver
      hikari:
        pool-name: AccountOraclePool
        maximum-pool-size: 15
        minimum-idle: 5
        connection-timeout: 10000
        idle-timeout: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
