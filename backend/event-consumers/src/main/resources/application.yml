server:
  port: ${SERVER_PORT:8085}

spring:
  application:
    name: event-consumers
  # No spring.datasource / spring.jpa.database-platform here on purpose:
  # this service has TWO datasources (see EventConsumersDataSourceConfig + app.datasource.*),
  # and a global dialect would be applied to both. Hibernate auto-detects each dialect.
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      use-big-decimal-for-floats: true   # money in events is read as exact BigDecimal, never double
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      # enable-auto-commit left at Spring's default (false): offsets are committed by the
      # listener container only AFTER a record is processed, so a crash cannot lose events.
    producer:   # used only by the DeadLetterPublishingRecoverer (-> transaction-events.DLT)
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

app:
  datasource:
    postgres:
      url: ${SPRING_DATASOURCE_POSTGRES_URL:jdbc:postgresql://localhost:5432/ledger_audit_db}
      username: ${SPRING_DATASOURCE_POSTGRES_USERNAME:audit_user}
      password: ${SPRING_DATASOURCE_POSTGRES_PASSWORD:AuditSecretPassword123}
      driver-class-name: org.postgresql.Driver
    oracle:
      url: ${SPRING_DATASOURCE_ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/XEPDB1}
      username: ${SPRING_DATASOURCE_ORACLE_USERNAME:ledger_master}
      password: ${SPRING_DATASOURCE_ORACLE_PASSWORD:MasterSecretPassword123}
      driver-class-name: oracle.jdbc.OracleDriver

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
