worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Disable nginx version in headers (minor security hardening)
    server_tokens off;

    server {
        listen       80;
        server_name  localhost;

        # ── Static SPA files ──────────────────────────────────────────────────
        root   /usr/share/nginx/html;
        index  index.html;

        # Serve all static assets — HTML, JS, CSS, fonts
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── API proxy → API Gateway ───────────────────────────────────────────
        # Forwards all /api/ requests from the browser to the gateway container
        # on the Docker internal network. This eliminates CORS issues that would
        # occur if the browser called the gateway directly from a different origin.
        location /api/ {
            proxy_pass         http://api-gateway:8080;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward auth and idempotency headers untouched
            proxy_pass_request_headers on;

            # Timeouts — balance mutations can take up to 5 s under lock contention
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        # ── Actuator proxy → API Gateway (for health badge in SPA) ───────────
        location /actuator/ {
            proxy_pass         http://api-gateway:8080/actuator/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Cache static assets aggressively ─────────────────────────────────
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy        "same-origin"   always;

        error_page 404 /index.html;
    }
}
