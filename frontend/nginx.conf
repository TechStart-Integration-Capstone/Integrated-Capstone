worker_processes  auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Disable nginx version in headers (minor security hardening)
    server_tokens off;

    server {
        listen       80;
        listen       443 ssl;
        server_name  paypink.westus2.cloudapp.azure.com localhost;

        # ── Let's Encrypt SSL Certificates ────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/paypink.westus2.cloudapp.azure.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/paypink.westus2.cloudapp.azure.com/privkey.pem;

        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ── Static SPA files ──────────────────────────────────────────────────
        root   /usr/share/nginx/html;
        index  index.html;

        # Serve all static assets — HTML, JS, CSS, fonts
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Revalidate the admin application after deployment.
        location = /src/js/app.js {
            expires off;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Customer banking uses stable asset names; revalidate them after updates.
        # ^~ keeps these files out of the seven-day immutable asset rule below.
        location ^~ /bank/ {
            try_files $uri $uri/ /bank/index.html;
            expires off;
            add_header Cache-Control "no-cache, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # ── Mobile App Proxy → mobile-app container ───────────────────────────
        # Reverse proxies the Flutter Mobile PWA over standard Port 80, keeping it
        # accessible on corporate firewalls and proxies that block non-standard port 3002.
        location ^~ /mobile/ {
            proxy_pass         http://mobile-app:80/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Accept-Encoding   "";

            # Dynamically rewrite base href so index.html works cleanly under /mobile/
            sub_filter '<base href="/">' '<base href="/mobile/">';
            sub_filter_types text/html;
            sub_filter_once on;
        }

        location = /mobile {
            return 301 /mobile/;
        }

        # ── API proxy → API Gateway ───────────────────────────────────────────
        # Forwards all /api/ requests from the browser to the gateway container
        # on the Docker internal network. This eliminates CORS issues that would
        # occur if the browser called the gateway directly from a different origin.
        location /api/ {
            proxy_pass         http://api-gateway:8080;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Forward auth and idempotency headers untouched
            proxy_pass_request_headers on;

            # Timeouts — balance mutations can take up to 5 s under lock contention
            proxy_connect_timeout  10s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        # ── Actuator proxy → API Gateway (for health badge in SPA) ───────────
        location /actuator/ {
            proxy_pass         http://api-gateway:8080/actuator/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
        }

        # ── Cache static assets aggressively ─────────────────────────────────
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # ── Security headers ──────────────────────────────────────────────────
        add_header X-Frame-Options        "SAMEORIGIN"    always;
        add_header X-Content-Type-Options "nosniff"       always;
        add_header Referrer-Policy        "same-origin"   always;

        error_page 404 /index.html;
    }
}
